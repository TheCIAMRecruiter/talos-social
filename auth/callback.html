<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TALOS Social — Signing in</title><style>body{font:16px system-ui,sans-serif;background:#f3f7fc;color:#122c50;margin:0;min-height:100vh;display:grid;place-items:center}.card{background:#fff;border-radius:16px;padding:35px;max-width:490px;margin:20px;box-shadow:0 12px 40px #0a1c3014}a{color:#1166c8}h1{margin-top:0}p{line-height:1.6}</style></head><body><main class="card"><h1>TALOS Social</h1><p id="status" role="status">Completing your secure sign-in…</p><p><a href="./approvals.html">Return to Approval Center</a></p></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.76.1';const sb=createClient('https://mrgzxokmjxpsdlymxjtc.supabase.co','sb_publishable_7ObZGAxI8WQm2T0TcLtZuQ_tMN3RlsB',{auth:{detectSessionInUrl:true,persistSession:true}});const msg=document.getElementById('status');const qs=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.slice(1));const error=qs.get('error_description')||hash.get('error_description');const code=qs.get('code');try{if(error)throw Error(error);if(code){const{error:e}=await sb.auth.exchangeCodeForSession(code);if(e)throw e;}const{data:{session},error:e}=await sb.auth.getSession();if(e)throw e;if(!session)throw Error('The sign-in link could not establish a session. Request a new link from the Approval Center.');msg.textContent='Signed in successfully. Redirecting to your Approval Center…';location.replace('./approvals.html');}catch(e){msg.textContent='Sign-in could not be completed: '+(e.message||String(e));}</script></body></html>
